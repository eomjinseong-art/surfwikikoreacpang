<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="서프위키Ai가 고른 서핑 용품 큐레이션">
  <title>서핑용품 | 서프위키Ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, "Noto Sans KR", -apple-system, BlinkMacSystemFont, helvetica, "Apple SD Gothic Neo", sans-serif; }
  </style>
</head>
<body class="bg-white text-black">
  <header class="sticky top-0 z-20 border-b border-neutral-200 bg-white">
    <div class="mx-auto max-w-5xl px-4 py-3">
      <div class="flex items-center justify-between gap-3">
        <a href="./" class="text-[22px] font-semibold tracking-[0.18em] text-black">서핑용품 <span class="hidden text-[11px] font-medium tracking-[0.28em] text-neutral-400 sm:inline">SURF WIKI</span></a>
        <a id="headerLink" href="#" target="_blank" rel="noopener" class="shrink-0 bg-black px-3 py-2 text-[11px] font-medium tracking-wide text-white">오늘의 특가</a>
      </div>
      <nav class="mt-3 flex gap-5 text-[13px] font-medium tracking-wide">
        <a href="./" class="border-b border-black pb-1 text-black">서핑용품</a>
        <a href="./wiki/" class="pb-1 text-neutral-400 hover:text-black">용품가이드</a>
        <a href="./wiki/?cat=서핑 입문" class="pb-1 text-neutral-400 hover:text-black">서핑가이드</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-4 pb-40">
    <section class="pt-5 pb-4">
      <p class="mb-1 hidden text-[11px] font-medium tracking-wide text-neutral-400 sm:block">서프위키Ai가 고른 오늘의 큐레이션</p>
      <h1 id="heroTitle" class="text-xl font-semibold leading-snug sm:text-2xl">바다에 나가기 전에, 용품부터</h1>
      <p id="heroDescription" class="mt-1 line-clamp-1 text-[12px] leading-5 text-neutral-500 sm:mt-2 sm:text-[13px]">보드부터 슈트·왁스·리쉬까지 한눈에 살펴보세요.</p>
      <p class="mt-1 overflow-hidden whitespace-nowrap text-[10px] leading-5 text-neutral-400">이 포스팅은 쿠팡 파트너스 활동으로 수수료를 제공받습니다.</p>
    </section>
    <section class="mb-2 flex items-center gap-4 overflow-x-auto border-b border-neutral-200 pb-3 text-[12px] font-medium tracking-wide">
      <a href="./wiki/" class="shrink-0 text-black">용품가이드</a>
      <a href="./wiki/?cat=서핑 입문" class="shrink-0 text-neutral-500 hover:text-black">서핑가이드</a>
      <a href="./wiki/02-chobo-checklist.html" class="shrink-0 text-neutral-500 hover:text-black">초보체크</a>
      <a href="./wiki/11-first-lesson.html" class="shrink-0 text-neutral-500 hover:text-black">첫 강습</a>
      <a href="./wiki/12-lineup-manner.html" class="shrink-0 text-neutral-500 hover:text-black">라인업</a>
      <a href="./wiki/03-board.html" class="shrink-0 text-neutral-500 hover:text-black">보드</a>
      <a href="./wiki/" class="shrink-0 text-neutral-400 hover:text-black">전체 →</a>
    </section>
    <nav class="sticky top-[5.4rem] z-10 -mx-4 mb-4 border-b border-neutral-200 bg-white px-4">
      <div class="flex items-center gap-4 overflow-x-auto">
        <button type="button" id="categoryAll" data-category="전체" class="shrink-0 px-1 py-2 text-[12px] font-medium">전체</button>
        <div id="categoryScroll" class="flex min-w-0 flex-1 gap-4 overflow-x-auto"></div>
      </div>
    </nav>
    <div id="status" class="py-16 text-center text-[12px] text-neutral-400">상품을 불러오는 중입니다.</div>
    <section id="productGrid" class="hidden grid grid-cols-2 gap-x-3 gap-y-8 sm:grid-cols-3 lg:grid-cols-4"></section>
  </main>
  <div id="modal" class="fixed inset-0 z-30 hidden items-end justify-center bg-black/50 p-0 sm:items-center sm:p-4">
    <article class="max-h-[90vh] w-full max-w-lg overflow-y-auto bg-white p-5">
      <div class="mb-4 flex justify-between"><span id="modalCategory" class="text-[11px] font-medium tracking-wide text-neutral-400"></span><button id="closeModal" class="text-2xl text-neutral-400" aria-label="닫기">&times;</button></div>
      <img id="modalImage" class="mb-4 h-64 w-full object-cover" alt="">
      <h2 id="modalTitle" class="text-lg font-semibold"></h2>
      <p id="modalDescription" class="mt-2 text-[13px] leading-6 text-neutral-500"></p>
      <a id="modalLink" target="_blank" rel="noopener" class="mt-6 block bg-black py-3 text-center text-[13px] font-medium text-white">쿠팡에서 상품 확인하기</a>
    </article>
  </div>
  <script>
    const CATEGORIES = ['보드/핀', '슈트/래시가드', '왁스/그립', '리쉬/안전', '가방/캐리어', '관리/수리', '액세서리', '기타'];
    const PLACEHOLDER = './images/placeholder.svg';
    const state = { products: [], category: '전체' };
    const $ = id => document.getElementById(id);
    function applySiteLinks(config) {
      $('heroTitle').textContent = config.hero.title;
      $('heroDescription').textContent = config.hero.description;
      $('headerLink').href = config.featuredLink;
      $('headerLink').textContent = config.featuredLabel;
      if (config.rocketWowLink) $('footerWow').href = config.rocketWowLink;
      if (config.lodgingLink) $('footerStay').href = config.lodgingLink;
    }
    fetch('./data/config.json').then(response => response.json()).then(applySiteLinks);
    fetch('./data/products.json').then(response => {
      if (!response.ok) throw new Error('상품 데이터 응답 오류');
      return response.json();
    }).then(products => {
      state.products = uniqueProducts(products).filter(item =>
        item.product?.imageUrl?.endsWith('.jpg') && !/^서핑 용품 추천 /.test(item.product.title || '')
      );
      renderCategories();
      renderProducts();
    }).catch(error => {
      $('status').textContent = '상품을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
      console.error(error);
    });
    function uniqueProducts(list) {
      const seen = new Set();
      return list.filter(item => {
        const title = item.product?.title || '';
        const key = item.product?.productId
          || (!/^서핑 용품 추천 /.test(title) && title)
          || item.product?.coupangUrl;
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }
    function buttonClass(category) {
      return `shrink-0 px-1 py-2 text-[12px] font-medium tracking-wide ${category === state.category ? 'border-b-2 border-black text-black' : 'text-neutral-400 hover:text-black'}`;
    }
    function renderCategories() {
      $('categoryAll').className = buttonClass('전체');
      const used = new Set(state.products.map(item => item.category));
      const visible = CATEGORIES.filter(category => used.has(category));
      $('categoryScroll').innerHTML = visible.map(category =>
        `<button type="button" data-category="${escapeHtml(category)}" class="${buttonClass(category)}">${escapeHtml(category)}</button>`
      ).join('');
      $('categoryAll').onclick = () => selectCategory('전체');
      $('categoryScroll').querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => selectCategory(button.dataset.category));
      });
    }
    function selectCategory(category) {
      state.category = category;
      renderCategories();
      renderProducts();
      $('productGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function visibleProducts() {
      const filtered = state.category === '전체'
        ? state.products
        : state.products.filter(item => item.category === state.category);
      return filtered.slice().sort((a, b) => {
        const aPhoto = a.product.imageUrl.endsWith('.jpg') ? 0 : 1;
        const bPhoto = b.product.imageUrl.endsWith('.jpg') ? 0 : 1;
        return aPhoto - bPhoto || a.id - b.id;
      });
    }
    function renderProducts() {
      const products = visibleProducts();
      $('status').classList.toggle('hidden', products.length > 0);
      $('productGrid').classList.toggle('hidden', products.length === 0);
      $('status').textContent = products.length
        ? ''
        : state.category === '전체'
          ? '표시할 상품이 없습니다.'
          : `${state.category} 상품이 없습니다.`;
      $('productGrid').innerHTML = products.map(item => `<a href="${escapeHtml(item.product.coupangUrl)}" target="_blank" rel="noopener sponsored" class="text-left"><img src="${escapeHtml(item.product.imageUrl)}" alt="${escapeHtml(item.product.title)}" class="aspect-square w-full object-cover" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER}'"><div class="pt-2"><span class="text-[10px] font-medium tracking-wide text-neutral-400">${escapeHtml(item.category || '추천')}</span><h2 class="mt-1 line-clamp-2 text-[12px] font-medium leading-5">${escapeHtml(item.product.title)}</h2><p class="mt-1 line-clamp-2 text-[11px] leading-4 text-neutral-500">${escapeHtml(item.description || item.product.description || '서핑을 위한 추천 용품')}</p></div></a>`).join('');
    }
    function openModal(item) {
      $('modalCategory').textContent = item.category || '추천';
      $('modalImage').onerror = function () { this.onerror = null; this.src = PLACEHOLDER; };
      $('modalImage').src = item.product.imageUrl;
      $('modalImage').alt = item.product.title;
      $('modalTitle').textContent = item.product.title;
      $('modalDescription').textContent = item.description || item.product.description || '서핑을 위한 추천 용품입니다.';
      $('modalLink').href = item.product.coupangUrl;
      $('modal').classList.replace('hidden', 'flex');
    }
    function closeModal() { $('modal').classList.replace('flex', 'hidden'); }
    $('closeModal').addEventListener('click', closeModal);
    $('modal').addEventListener('click', event => { if (event.target === $('modal')) closeModal(); });
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char])); }
  </script>
  <div class="fixed inset-x-0 bottom-0 z-40 border-t border-neutral-200 bg-white">
    <div class="flex">
      <a id="footerWow" href="https://link.coupang.com/a/gU16lCobu0" target="_blank" rel="noopener sponsored" class="flex-1 py-2 text-center text-[11px] font-medium tracking-wide text-black">로켓와우</a>
      <a id="footerStay" href="https://link.coupang.com/a/gU3EgPN6wS" target="_blank" rel="noopener sponsored" class="flex-1 border-l border-neutral-200 py-2 text-center text-[11px] font-medium tracking-wide text-black">서핑 숙소</a>
    </div>
    <a href="https://surfwikikorea.vercel.app/" target="_blank" rel="noopener" class="block bg-black py-3 text-center text-[13px] font-medium tracking-wide text-white" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom))">서프위키Ai 바로가기</a>
  </div>
</body>
</html>
