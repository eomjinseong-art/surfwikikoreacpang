<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="서핑 용품을 상황별로 고르는 용품가이드">
  <title>용품가이드 | 서핑용품</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 text-slate-800" style="font-family:'Noto Sans KR', sans-serif">
  <header class="sticky top-0 z-20 border-b border-sky-100 bg-white/95 backdrop-blur">
    <div class="mx-auto max-w-5xl px-4 py-3">
      <div class="flex items-center justify-between gap-3">
        <a href="../" class="text-2xl font-black tracking-wide text-teal-600" style="font-family:'Black Han Sans', sans-serif">서핑용품 <span class="hidden text-base font-medium tracking-normal text-slate-400 sm:inline">SURF WIKI</span></a>
        <a id="headerLink" href="#" target="_blank" rel="noopener" class="shrink-0 rounded-full bg-cyan-600 px-3 py-2 text-xs font-bold text-white">오늘의 특가</a>
      </div>
      <nav class="mt-2 flex gap-4 text-sm font-bold">
        <a href="../" class="text-slate-400 hover:text-teal-600">서핑용품</a>
        <a href="./" class="text-slate-900">용품가이드</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-4 pb-40">
    <section class="py-8">
      <p class="mb-2 text-sm font-bold text-teal-600">용품가이드</p>
      <h1 class="text-3xl font-black leading-tight sm:text-4xl">사는 법만 모아 둔 서핑 용품</h1>
      <p class="mt-3 max-w-xl text-sm leading-6 text-slate-500">보드·슈트·왁스·리쉬를 고를 때 볼 스펙과 순서. 스팟과 파도는 서프위키Ai에서 이어집니다.</p>
    </section>
    <nav class="sticky top-[5.5rem] z-10 -mx-4 mb-5 border-b border-sky-100 bg-sky-50/95 px-4 py-2 backdrop-blur">
      <div id="wikiCats" class="flex gap-2 overflow-x-auto pb-1"></div>
    </nav>
    <section id="guideGrid" class="grid gap-3 sm:grid-cols-2"></section>
    <section class="mt-10 rounded-2xl border border-sky-100 bg-white p-5">
      <h2 class="text-lg font-black">스팟·파도·숙소는 서프위키Ai에서</h2>
      <p class="mt-2 text-sm leading-6 text-slate-500">전국 스팟, 실시간 파도, 숙소, AI 가이드는 서프위키Ai에 모아 두었습니다.</p>
      <ul id="blogTopics" class="mt-4 grid gap-2 sm:grid-cols-2"></ul>
      <a id="blogCta" href="https://surfwikikorea.vercel.app/" target="_blank" rel="noopener" class="mt-5 inline-block rounded-xl bg-cyan-600 px-4 py-3 text-sm font-bold text-white">서프위키Ai 바로가기</a>
    </section>
  </main>
  <div class="fixed inset-x-0 bottom-0 z-40">
    <div class="flex border-t border-cyan-100 bg-cyan-50">
      <a href="https://link.coupang.com/a/gKenl0nyO4" target="_blank" rel="noopener sponsored" class="flex-1 py-2 text-center text-[11px] font-semibold text-teal-700">로켓와우</a>
      <a href="https://link.coupang.com/a/gTxkqIiE4y" target="_blank" rel="noopener sponsored" class="flex-1 border-l border-cyan-100 py-2 text-center text-[11px] font-semibold text-teal-700">서핑 숙소</a>
    </div>
    <a href="https://surfwikikorea.vercel.app/" target="_blank" rel="noopener" class="block bg-cyan-600 py-3 text-center text-sm font-bold text-white shadow-[0_-8px_24px_rgba(0,0,0,.12)]" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom))">서프위키Ai 바로가기</a>
  </div>
  <script>
    const state = { guides: [], category: '전체', blog: 'https://surfwikikorea.vercel.app/' };
    const $ = id => document.getElementById(id);
    fetch('../data/config.json').then(r => r.json()).then(config => {
      $('headerLink').href = config.featuredLink;
      $('headerLink').textContent = config.featuredLabel;
    });
    fetch('./guides.json').then(r => r.json()).then(data => {
      state.guides = data.guides || [];
      state.blog = data.blog || state.blog;
      $('blogCta').href = state.blog;
      $('blogTopics').innerHTML = (data.blogTopics || []).map(item =>
        `<li><a href="${escapeHtml(state.blog)}" target="_blank" rel="noopener" class="flex items-baseline justify-between gap-3 rounded-xl bg-sky-50 px-3 py-3 hover:bg-cyan-50"><span class="text-sm font-bold">${escapeHtml(item.title)}</span><span class="text-xs text-slate-400">${escapeHtml(item.note || '')}</span></a></li>`
      ).join('');
      renderCats();
      renderGuides();
    }).catch(() => {
      $('guideGrid').innerHTML = '<p class="rounded-xl bg-white p-8 text-center text-sm text-slate-400">가이드 목록을 불러오지 못했습니다.</p>';
    });
    function cats() {
      return ['전체', ...[...new Set(state.guides.map(g => g.wikiCategory))]];
    }
    function chipClass(name) {
      return `shrink-0 rounded-full px-4 py-2 text-xs font-bold ${name === state.category ? 'bg-slate-900 text-white' : 'bg-white text-slate-500'}`;
    }
    function renderCats() {
      $('wikiCats').innerHTML = cats().map(name =>
        `<button type="button" data-cat="${escapeHtml(name)}" class="${chipClass(name)}">${escapeHtml(name)}</button>`
      ).join('');
      $('wikiCats').querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          state.category = button.dataset.cat;
          renderCats();
          renderGuides();
        });
      });
    }
    function renderGuides() {
      const list = state.category === '전체'
        ? state.guides
        : state.guides.filter(g => g.wikiCategory === state.category);
      $('guideGrid').innerHTML = list.map(guide =>
        `<a href="./${encodeURIComponent(guide.slug)}.html" class="rounded-2xl border border-sky-100 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:shadow-md"><span class="text-[11px] font-bold text-teal-600">${escapeHtml(guide.wikiCategory)}</span><h2 class="mt-2 text-lg font-black">${escapeHtml(guide.title)}</h2><p class="mt-2 text-sm leading-6 text-slate-500">${escapeHtml(guide.description)}</p><p class="mt-3 text-xs text-slate-400">읽는 시간 약 ${guide.readMinutes}분</p></a>`
      ).join('');
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }
  </script>
</body>
</html>
