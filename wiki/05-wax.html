  <style>
    .wiki-prose h2 {
      margin: 2rem 0 0.85rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #bae6fd;
      font-size: 1.25rem;
      font-weight: 900;
      scroll-margin-top: 6rem;
    }
    .wiki-prose h3 {
      margin: 1.4rem 0 0.6rem;
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f766e;
      scroll-margin-top: 6rem;
    }
    .wiki-prose p { margin: 0.7rem 0; line-height: 1.8; font-size: 0.95rem; }

    .wiki-prose hr { margin: 1.5rem 0; border: 0; border-top: 1px solid #e0f2fe; }
    .wiki-prose a { color: #0d9488; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
    .wiki-prose table { width: 100%; margin: 1rem 0; border-collapse: collapse; font-size: 0.85rem; background: #fff; }
    .wiki-prose th, .wiki-prose td { border: 1px solid #bae6fd; padding: 0.55rem 0.7rem; vertical-align: top; }
    .wiki-prose th { background: #f0f9ff; font-weight: 800; text-align: left; }
    .wiki-prose blockquote {
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      border-left: 4px solid #22d3ee;
      background: #ecfeff;
      color: #475569;
    }

</head>
<body class="bg-sky-50 font-sans text-slate-800">

    <a href="https://surfwikikorea.vercel.app/" target="_blank" rel="noopener" class="block bg-cyan-600 py-3 text-center text-sm font-bold text-white shadow-[0_-8px_24px_rgba(0,0,0,.12)]" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom))">서프위키Ai 바로가기</a>
